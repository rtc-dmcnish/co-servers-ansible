# managed by Ansible

# provides RELP syslog caching
module(load="omrelp")
*.* action(
    type="omrelp"
	target="192.168.4.33"
	port="2514"

    # --- Memory Queue Allocation (Optimized for 8GB RAM) ---
    queue.type="LinkedList"
    queue.size="2000000"             # Hold up to 1M messages in RAM (~500MB)
    queue.highwatermark="800000"     # Start writing to disk at 80% capacity
    queue.lowwatermark="200000"      # Stop writing to disk once queue drops to 20%
    
    # --- Disk-Assisted Spillover ---
    queue.filename="omrelp_cache"    # Turns on disk-assisted mode
    queue.maxdiskspace="8g"         # Adjust based on your available disk space
    queue.maxfilesize="100m"         # Split disk cache into manageable 100MB chunks
    
    # --- Reliability Settings ---
    queue.saveonshutdown="on"        # Flush RAM queue to disk if Rsyslog stops
    action.resumeretrycount="-1"     # Retry connection indefinitely
    action.resumeinterval="5"        # Wait 5 seconds before retrying a dropped connection

)

module(load="impstats" 
       interval="60"             # Log stats every 60 seconds
       severity="6"              # Log at info level
       log.file="/var/log/rsyslog-stats.log" # Output file path
)

# provides UDP syslog reception
module(load="imudp")
input(type="imudp" port="514")

# provides TCP syslog reception
module(load="imtcp")
input(type="imtcp" port="514")

