---
- name: Upgrade Debian Packages and Check Reboot Status
  hosts: debian_servers
  tasks:

    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        upgrade: safe
        update_cache: yes
      register: apt_output

    # - name: Display upgraded packages from APT terminal log
    #   ansible.builtin.debug:
    #     var: apt_output.stdout_lines
    #   when: apt_output.stdout_lines is defined and apt_output.changed

    - name: Run needrestart check
      ansible.builtin.command: needrestart -p
      register: needrestart_output
      changed_when: false
      failed_when: needrestart_output.rc not in [0, 1, 2]

    - name: Set reboot requirement facts
      ansible.builtin.set_fact:
        needs_reboot: "{{ 'CRIT - Kernel:' in needrestart_output.stdout }}"

    - name: Notify when a reboot is needed
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} requires a reboot to complete updates!"
      when: needs_reboot


